<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">AMRKB — research content, methodology and emerging uses</title><desc id="desc">Eight source-proposed overlapping agricultural families, separate record concepts, twelve cross-family functions and five themes; no new classifications or memberships. Developing DRM is methodology, not scientific ownership. Downstream uses are proposed, not software capabilities.</desc>
